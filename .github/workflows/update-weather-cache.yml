name: Update Weather Cache

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: weather-cache-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update weather cache
        run: node update-weather-cache.js

      - name: Show generated file
        run: |
          ls -l weather-cache.json
          cat weather-cache.json | head -40

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-cache.json
          git diff --staged --quiet || git commit -m "Update weather cache"
          git push
